
services:
  # ZENVORA AI Backend
  - type: web
    name: zenvora-ai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://zenvora-ai-frontend.onrender.com
      # ── AI Engine Keys (set manually in Render dashboard) ──────────────────
      - key: GEMINI_API_KEY
        sync: false          # Set in Render dashboard: https://aistudio.google.com/app/apikey
      - key: GOOGLE_SEARCH_API_KEY
        sync: false          # Optional: Google Custom Search API key for real web research
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false          # Optional: Google Programmable Search Engine ID

  # ZENVORA AI Frontend
  - type: static
    name: zenvora-ai-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://zenvora-ai-backend.onrender.com/api
