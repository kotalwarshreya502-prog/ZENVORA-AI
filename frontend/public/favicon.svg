<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="zenvora-grad-1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7657F6" />
      <stop offset="100%" stop-color="#20C9B0" />
    </linearGradient>
    <linearGradient id="zenvora-grad-2" x1="12" y1="36" x2="36" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20C9B0" />
      <stop offset="100%" stop-color="#7657F6" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="48" height="48" rx="14" fill="#11152B" />
  
  <!-- Outer Elliptical Orbital Ring (Forward Tilt) -->
  <ellipse cx="24" cy="24" rx="18" ry="8" transform="rotate(-30 24 24)" stroke="url(#zenvora-grad-1)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="75 25" />
  
  <!-- Dynamic Forward Chevron / Velocity Core -->
  <path d="M19 16L29 24L19 32" stroke="url(#zenvora-grad-1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Growth Node (Orbital Satellite) -->
  <circle cx="36" cy="18" r="3.2" fill="#20C9B0">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>

